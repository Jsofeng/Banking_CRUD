name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  jobs:
    test:
      runs-on: ubuntu-latest
      
      defaults:
        run:
          working-directory: bank-app/frontend
      
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm
            cache-dependency-path: bank-app/frontend/package-lock.json

        - name: Install dependencies
          run: npm install

        - name: Lint
          run: npm run lint

        - name: Run tests
          run: npm test -- --run --coverage

        - name: Build application
          run: npm run build