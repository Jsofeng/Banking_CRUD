name: Backend CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest

    services:

      redis:
        image: redis:7
        ports:
          - 6379:6379 
          
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bank_app_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/bank_app_test"
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        working-directory: bank-app/backend
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir '.[dev]'


      - name: Lint
        working-directory: bank-app/backend
        run: |
          flake8 .


      - name: Run tests
        working-directory: bank-app/backend
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80



  build:
    runs-on: ubuntu-latest

    needs: test


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker images
        working-directory: bank-app
        run: |
          docker compose build