name: Run Migrations

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bank_app
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d bank_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bank-app/backend/requirements.txt

      - name: Run migrations
        working-directory: bank-app/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/bank_app
          ALEMBIC_DATABASE_URL: postgresql://postgres:password@localhost:5432/bank_app
        run: alembic upgrade head