[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-app"
version = "0.1.0"
description = "FastAPI banking CRUD application"
requires-python = ">=3.11"

dependencies = [
    "alembic==1.16.5",
    "bcrypt==4.2.1",
    "celery==5.6.3",
    "faker==37.12.0",
    "fastapi==0.115.6",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.5",
    "python-dotenv==1.0.1",
    "python-jose==3.3.0",
    "python-multipart==0.0.20",
    "redis==7.0.1",
    "slowapi==0.1.10",
    "sqlalchemy==2.0.37",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "black==25.11.0",
    "coverage==7.10.7",
    "coverage-badge==1.1.2",
    "flake8==7.3.0",
    "httpx==0.28.1",
    "isort==6.1.0",
    "mypy-extensions==1.1.0",
    "pytest==8.3.4",
    "pytest-asyncio==1.2.0",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]