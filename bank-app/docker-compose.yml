services:
  db:
    image: postgres:17
    container_name: bank-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bank_app

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: bank-backend

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/bank_app

  frontend:
    build: ./frontend

    container_name: bank-frontend

    ports:
      -"5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: